<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOKISHIRO</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: #fff;
            font-family: "Bebas Neue", Impact, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .main {
            text-align: center;
        }

        .nickname {
            font-size: clamp(4rem, 15vw, 8rem);
            line-height: 0.9;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 5px 5px 0 #171717;
        }

        .japanese {
            margin-top: 12px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 8px;
            color: #e50914;
        }

        .links {
            width: 100%;
            max-width: 320px;
            margin-top: 45px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .links a {
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: #fff;
            border: 1px solid #333;
            padding: 14px 20px;
            text-align: center;
            font-size: 20px;
            letter-spacing: 3px;
            background: #0b0b0b;
            transition: 0.25s ease;
        }

        .links a::before {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 3px;
            background: #e50914;
            transition: 0.25s ease;
        }

        .links a:hover {
            color: #fff;
            background: #e50914;
            border-color: #e50914;
            transform: translateY(-3px);
        }

        .links a:hover::before {
            width: 100%;
        }

        footer {
            position: absolute;
            bottom: 22px;
            color: #555;
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
        }

        @media (max-width: 500px) {
            .nickname {
                letter-spacing: 2px;
            }

            .links {
                margin-top: 35px;
                max-width: 290px;
            }

            .links a {
                padding: 13px 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <main class="main">
            <h1 class="nickname">TOKISHIRO</h1>
            <div class="japanese">絶対</div>

            <nav class="links">
                <a href="#">TWITCH</a>
                <a href="#">YOUTUBE</a>
                <a href="#">TIKTOK</a>
            </nav>
        </main>

        <footer>© 2026 TOKISHIRO</footer>

    </div>

</body>
</html>
